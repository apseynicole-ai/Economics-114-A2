function textFor(gr){
 const u=gr.unit, n=gr.name.toLowerCase(), rule=(rules[u]||[]).join('; ');
 let why=`This model matters because Unit ${u} questions use it to test ${gr.topic.toLowerCase()}, graph interpretation and application. It can appear as ${gr.types.join(', ')}. Past-paper relevance: ${gr.past}.`;
 let draw=`Label the axes or players first. Add the main curve, line, matrix or decision node. Mark the predicted/private outcome and, if relevant, the efficient/social outcome. Add the condition beside the diagram: ${rule}. Shade or box surplus, DWL, rent, tax revenue, or equilibrium only after the core labels are correct.`;
 let means=`Every label is a mark opportunity. The diagram shows the mechanism behind ${gr.topic.toLowerCase()}: who chooses, what constraint binds, where the equilibrium lies, and whether the outcome is efficient, fair, stable, or policy-corrected.`;
 let resp=`${gr.name} is used to analyse ${gr.topic.toLowerCase()} in Unit ${u}. The key is to identify the relevant condition (${rule}) and then apply it to the scenario rather than merely naming the graph. In an exam, state what the axes or players represent, locate the private or predicted outcome, compare it with the efficient or socially preferred outcome when relevant, and conclude with the welfare, fairness, power or incentive implication.`;
 if(u==='4') resp=`${gr.name} analyses strategic interaction, where each player's best action depends on the other player's action. Use the matrix or tree to identify best responses, Nash equilibrium, dominant strategies and Pareto comparisons. The strong exam move is to separate stability from social desirability: a Nash equilibrium is a mutual best response, but it may be Pareto inefficient or unfair. Apply the payoffs to the scenario and conclude whether institutions, repetition, punishment or norms could improve the outcome.`;
 if(u==='5') resp=`${gr.name} belongs to the Angela-Bruno institutional model. It shows how preferences, feasible production, reservation options and power determine who works, who receives grain and who captures surplus. A strong answer labels grain and free time, identifies the relevant constraint, applies MRS=MRT or the reservation condition when relevant, and then separates efficiency from fairness. The conclusion should explain how the institution changes bargaining power and surplus distribution.`;
 if(u==='6') resp=`${gr.name} explains the employment relationship and labour discipline model. The central mechanism is that firms buy labour time but must induce effort, so wages, employment rents and job-loss costs matter. A strong answer links the graph to incomplete contracts: higher wages can create employment rent, employment rent makes dismissal costly, and this can increase effort. Conclude by explaining the implication for firm wage-setting or involuntary unemployment.`;
 if(u==='7') resp=`${gr.name} is part of the price-setting firm model. The crucial exam logic is that a firm with downward-sloping demand chooses output where MR=MC and then reads price from demand. A strong answer distinguishes demand, MR, MC and AC, shows the profit or welfare area if relevant, and explains why market power allows P to exceed MC. Conclude with the effect on profit, consumer surplus, markup or deadweight loss.`;
 if(u==='8') resp=`${gr.name} is part of competitive market and policy analysis. The graph should be used to identify equilibrium, surplus and whether a policy changes traded quantity. A strong answer labels demand as WTP and supply as WTA/MC, finds the equilibrium or policy outcome, calculates any shortage, surplus, tax revenue or DWL, and concludes with the efficiency and distributional effect.`;
 if(u==='10') resp=`${gr.name} diagnoses market failure and policy. The key is to ask whether private decision-makers face full social costs and benefits. A strong answer labels private and social curves, identifies Qprivate and Qefficient, explains the wedge causing overproduction or underproduction, and evaluates the policy response such as Pigouvian tax, subsidy, regulation or bargaining. Conclude with efficiency and, where relevant, fairness or compensation.`;
 return {why,draw,means,resp};
}
function card(gr){

 return `<article class="graph-card" id="${gr.id}" data-unit="${gr.unit}" data-likelihood="${gr.likelihood}" data-types="${gr.types.join(' ')}" data-search="${esc((gr.name+' '+gr.topic+' '+gr.classification+' '+gr.likelihood+' '+gr.types.join(' ')+' '+gr.past).toLowerCase())}">
 <div class="card-head"><div><div class="card-title">${esc(gr.name)}</div><div class="pillbar"><span class="badge unit">Unit ${gr.unit}</span><span class="badge core">${esc(gr.classification)}</span><span class="badge ${badgeLikelihood(gr.likelihood)}">${esc(gr.likelihood)}</span>${gr.types.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div><div class="controls"><label><input type="checkbox" onchange="storeSet('done-${gr.id}',this.checked?'1':'')" ${storeGet('done-'+gr.id)?'checked':''}> done</label><label class="small">confidence <input type="range" min="0" max="5" value="${storeGet('conf-'+gr.id,'0')}" oninput="storeSet('conf-${gr.id}',this.value)"></label></div></div>

 <div class="box"><b>LIKELY A2 QUESTION:</b> ${esc(t.why)}</div>

 <div class="btnrow no-print"><button class="btn" onclick="this.closest('.graph-card').classList.toggle('hide-labels')">Hide/reveal graph labels</button><button class="btn" onclick="this.closest('.graph-card').classList.toggle('show-answers')">Reveal practice answers</button></div>
 <details open><summary>How to draw it in the exam</summary><p>${esc(t.draw)}</p><div class="box draw"><b>HOW TO DRAW IN 60 SECONDS:</b> Identify axes/players, draw the core object, mark the equilibrium or policy point, add the formula/rule, then shade only the requested area.</div></details>
 <details ${compact?'':'open'}><summary>What each part means</summary><p>${esc(t.means)}</p></details>
 <details ${compact?'':'open'}><summary>Formulas / conditions / rules</summary><ul>${(rules[gr.unit]||[]).map(r=>`<li><code>${esc(r)}</code></li>`).join('')}</ul></details>
 <div class="box response"><b>80%+ RESPONSE:</b> ${esc(t.resp)}</div>
 ${compact?`<div class="box trap"><b>EXAM TRAP:</b> This is marked light/compact, but it remains examinable. Know the definition, diagram and one application.</div>`:`
 <details><summary>Basic answer vs 80%+ answer</summary><table><tr><th>Basic answer</th><th>Why incomplete</th><th>80%+ upgraded answer</th></tr><tr><td>This graph shows ${esc(gr.topic.toLowerCase())}.</td><td>It names the model but does not explain the mechanism or exam condition.</td><td>This graph shows ${esc(gr.topic.toLowerCase())}; the key condition is ${(rules[gr.unit]||['the relevant equilibrium condition'])[0]}, which determines the outcome and allows an efficiency, fairness or policy conclusion.</td></tr></table></details>
 <details><summary>Common mistakes / exam traps</summary><ul>${trapForUnit(gr.unit).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>
 <details><summary>Application question types</summary><table><tr><th>T/F</th><td>Test the definition or a common confusion.</td></tr><tr><th>MCQ</th><td>Identify the correct point, rule or curve.</td></tr><tr><th>Short application</th><td>Apply the graph to a scenario in 3-5 sentences.</td></tr><tr><th>Long written</th><td>Draw, label, explain mechanism, evaluate efficiency/fairness/policy.</td></tr><tr><th>Graph labelling</th><td>Label curves, equilibrium, areas and formulas.</td></tr></table></details>
 <details><summary>Mini practice</summary><p><b>T/F:</b> A correct answer using ${esc(gr.name)} only needs the name of the graph. <span class="answer"><b>Answer:</b> False. You must explain the rule and mechanism.</span></p><p><b>MCQ:</b> The safest first step is A. shade DWL, B. label axes/players, C. write a conclusion, D. ignore the scenario. <span class="answer"><b>Answer:</b> B. Correct labels anchor the model.</span></p><p><b>Short application:</b> In one sentence, identify the private/predicted outcome for a scenario using this model.</p><p><b>Longer prompt:</b> Draw and explain ${esc(gr.name)} and apply it to an unfamiliar A2 scenario.</p><p class="answer"><b>Memo:</b> Define the model, label the graph, identify the key condition, compare outcomes if relevant, explain the mechanism, and conclude with efficiency/fairness/power/policy implications.</p></details>
 <details><summary>Study method</summary><ul><li><b>Memorise:</b> the rule ${(rules[gr.unit]||[''])[0]}.</li><li><b>Redraw:</b> from blank page in 60 seconds with labels hidden first.</li><li><b>PANIC LINE:</b> Name the model, state the rule, locate the outcome, explain the consequence.</li><li><b>Easiest marks:</b> axes/players, rule, equilibrium, one correct implication.</li></ul></details>`}
 <label class="small">My notes for this card</label><textarea oninput="storeSet('note-${gr.id}',this.value)">${esc(storeGet('note-'+gr.id,''))}</textarea>
 </article>`;
}

}

 document.getElementById('plans').innerHTML=sectionHead('Final 48-Hour Study Plan')+`<div class="grid"><div class="panel span-4"><h3>3-day plan</h3><p>Day 1: Units 4-5. Day 2: Units 6-8. Day 3: Unit 10, calculations and final boss.</p></div><div class="panel span-4"><h3>2-day plan</h3><p>Day 1: Games, institutions, labour discipline. Day 2: firms, markets, tax, externalities.</p></div><div class="panel span-4"><h3>Night-before</h3><p>Redraw top graphs, read traps, do calculations, sleep.</p></div><div class="panel span-12"><h3>Confidence traffic-light by unit</h3><div class="traffic">${Object.entries(unitNames).map(([u,n])=>`<span class="${Number(storeGet('unitconf-'+u,'0'))>=4?'green':Number(storeGet('unitconf-'+u,'0'))>=2?'amber':'red'}">Unit ${u}: ${n} <input type="range" min="0" max="5" value="${storeGet('unitconf-'+u,'0')}" oninput="storeSet('unitconf-${u}',this.value); renderPanicPlansCram()"></span>`).join('')}</div></div></div>`;
 document.getElementById('cram').innerHTML=sectionHead('Final Cram Sheet')+`<div class="grid"><div class="panel span-6"><h3>Memorise word-for-word</h3><ol><li>Nash equilibrium: mutual best response.</li><li>Dominant strategy: best regardless of other player.</li><li>Pareto improvement: at least one better off, nobody worse off.</li><li>MRS=MRT for Angela efficiency.</li><li>Employment rent = job value minus fallback.</li><li>Price-setting firm: Q from MR=MC, P from demand.</li><li>Tax revenue = tax x Qafter tax.</li><li>MSC=MPC+MEC.</li><li>Pigouvian tax = MEC at Qefficient.</li><li>Moral hazard after, adverse selection before.</li></ol></div><div class="panel span-6"><h3>Understand rather than memorise</h3><ul><li>Why Nash can be socially bad.</li><li>Why voluntary can still be unequal.</li><li>Why firms pay above reservation wage.</li><li>Why MR lies below demand.</li><li>Why taxes and monopoly create DWL differently.</li><li>Why externalities create market failure.</li></ul></div><div class="panel span-12"><h3>80% readiness checklist</h3><ul class="two-col">${graphs.filter(x=>x.likelihood==='Very high').map(x=>`<li>Can redraw and explain ${esc(x.name)}</li>`).join('')}</ul></div></div>`;
}
function renderBoss(){
 const tf=[['A Nash equilibrium is always Pareto efficient.','False','Nash is stability; Pareto efficiency asks whether mutual gains remain.'],['A dominant strategy is best regardless of what the other player does.','True','That is the definition of dominant strategy.'],['A voluntary contract can still be unfair if bargaining power is unequal.','True','Acceptance only means the offer beats the reservation option.'],['Angela’s efficient choice occurs where MRS = MRT.','True','Her preference trade-off equals the technological trade-off.'],['A point above the feasible frontier is technically feasible.','False','It requires more output than technology allows.'],['Employment rent is the value of a job relative to the next-best alternative.','True','It is what the worker loses if fired.'],['A price-setting firm reads price from the MR curve.','False','Q comes from MR=MC; P comes from demand.'],['For linear demand, MR has the same intercept and twice the slope.','True','If P=a-bQ, MR=a-2bQ.'],['A competitive firm chooses output where P = MC.','True','For price-takers, P=MR.'],['Tax revenue uses the pre-tax quantity.','False','Use the quantity traded after the tax.'],['The less elastic side bears more of a tax.','True','It is less able to escape the tax.'],['A binding price ceiling creates a shortage.','True','Below equilibrium, Qd exceeds Qs.'],['A binding price floor creates a shortage.','False','It creates a surplus.'],['A negative externality usually causes overproduction.','True','Private decision-makers ignore MEC.'],['MSC is the same as MEC.','False','MSC=MPC+MEC.'],['A Pigouvian tax equals total external damage.','False','It equals MEC at Qefficient.'],['A positive externality usually causes underproduction.','True','Private buyers ignore external benefits.'],['Public goods are defined as goods provided by government.','False','They are non-rival and non-excludable.'],['Moral hazard is hidden action after a contract.','True','Adverse selection is hidden type before the contract.'],['Slope and elasticity are identical.','False','Elasticity is percentage responsiveness.']];
 const mcqs=[['Nash equilibrium means:', ['Highest total payoff','No unilateral profitable deviation','Equal payoffs','Fair outcome'],1,'Nash is a mutual best-response concept.'],['A Pareto improvement means:', ['Someone gains and someone loses','At least one gains and nobody loses','Total output rises only','Payoffs are equal'],1,'No one may be made worse off.'],['Efficiency in Angela’s own choice occurs where:', ['MR=MC','MRS=MRT','Qd=Qs','P=AC'],1,'MRS and MRT compare preference and technology trade-offs.'],['A reservation IC shows:', ['Fallback utility','Tax revenue','Market supply','Marginal revenue'],0,'It is Angela’s walk-away utility.'],['Employment rent rises when:', ['Job loss is more costly','Wage is below reservation','Effort is impossible','Unemployment disappears fully'],0,'A costly job loss raises the rent.'],['Cost per efficiency unit is:', ['e/w','w/e','P/Q','MEC/MPC'],1,'Cost per unit of effort is wage divided by effort.'],['For a price-setting firm, output is where:', ['P=MC','MR=MC','D=S','MRS=MRT'],1,'MR=MC chooses quantity.'],['If P=80-2Q, MR is:', ['80-Q','80-4Q','40-2Q','2Q-80'],1,'Double the slope.'],['Monopoly price is read from:', ['MR','Demand','MC','AC minimum only'],1,'Demand shows WTP at Q*.'],['Markup equals:', ['P-MC','MC-P','Qd-Qs','MSC-MSB'],0,'Markup is price above marginal cost.'],['Competitive equilibrium is where:', ['MR=MC','Qd=Qs','Gini=0','MRS=MRT'],1,'Market clearing condition.'],['Consumer surplus is:', ['WTP-price','price-WTA','tax x Q','P-MC'],0,'Buyer gain from trade.'],['Producer surplus is:', ['WTP-price','price-WTA','MR-MC','Gini area'],1,'Seller gain from trade.'],['A binding price ceiling is set:', ['Below equilibrium','Above equilibrium','At AC minimum','At MR=0'],0,'A maximum price only binds below P*.'],['A binding price floor causes:', ['Shortage','Surplus','No effect','MR=MC'],1,'At high legal minimum, Qs exceeds Qd.'],['Tax incidence depends on:', ['Legal liability only','Relative elasticity','Gini coefficient','Nash equilibrium'],1,'Less elastic side bears more.'],['Tax revenue equals:', ['tax x Qafter tax','tax x Qbefore tax always','CS+PS','DWL'],0,'Use post-tax traded quantity.'],['Negative externality efficient output is where:', ['D=MPC','D=MSC','MR=MC','Qd=Qs only'],1,'Social cost must be included.'],['MSC equals:', ['MPC+MEC','MPB+MEB','MR+MC','P-AC'],0,'Full social marginal cost.'],['A Pigouvian tax targets:', ['MEB','MEC at Qefficient','AC minimum','Consumer surplus'],1,'Corrective tax internalises external cost.'],['A public good is:', ['Rival and excludable','Non-rival and non-excludable','Always free','Always state-produced'],1,'Definition depends on rivalry/excludability.'],['Moral hazard occurs:', ['Before contract hidden type','After contract hidden action','When D=S','When price floor binds'],1,'Timing is after contract.'],['Adverse selection involves:', ['Hidden type before contract','Hidden action after contract','Tax wedge','Consumer surplus'],0,'Timing is before contract.'],['If demand is elastic, a price increase will usually:', ['Raise total revenue','Lower total revenue','Leave TR unchanged','Make MR zero always'],1,'Elastic demand responds strongly.'],['The efficient competitive quantity is where:', ['WTP=MC','MR=0','Gini=1','Price ceiling binds'],0,'Marginal benefit equals marginal cost.']];
 const shorts=['Explain why a social dilemma can be stable but inefficient.','Use reservation IC to explain a take-it-or-leave-it contract.','Explain why employment rent induces effort.','Explain why monopoly price is read from demand.','Calculate tax revenue from a tax wedge.','Explain why negative externality output is too high.','Distinguish moral hazard from adverse selection.','Explain binding price ceiling shortage.','Explain elasticity and total revenue.','Explain Coasean payment range.'];
 document.getElementById('boss').innerHTML=sectionHead('Final Boss Practice Set')+`<div class="panel"><h3>20 T/F statements</h3><ol>${tf.map((t,i)=>`<li>${t[0]} <span class="answer"><b>Answer:</b> ${t[1]}. ${t[2]}</span></li>`).join('')}</ol><button class="btn" onclick="this.parentElement.classList.toggle('show-answers')">Reveal T/F answers</button></div><div class="panel"><h3>25 MCQs</h3><ol>${mcqs.map((q,i)=>`<li><b>${q[0]}</b><br>${q[1].map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join(' ')}<div class="answer"><b>Answer:</b> ${String.fromCharCode(65+q[2])}. ${q[3]}</div></li>`).join('')}</ol><button class="btn" onclick="this.parentElement.classList.toggle('show-answers')">Reveal MCQ answers</button></div><div class="panel"><h3>10 short application questions</h3><ol>${shorts.map(s=>`<li>${s}<div class="answer"><b>Memo:</b> Define the model, state the rule, apply the scenario, and conclude with the relevant efficiency/fairness/policy implication.</div></li>`).join('')}</ol><button class="btn" onclick="this.parentElement.classList.toggle('show-answers')">Reveal short memos</button></div><div class="panel"><h3>6 longer questions with full memo-style guidance</h3>${['Unit 4 social dilemma matrix','Unit 5 Angela-Bruno contract','Unit 6 labour discipline model','Unit 7 monopoly graph','Unit 8 tax wedge and incidence','Unit 10 negative externality and Pigouvian tax'].map((q,i)=>`<details><summary>${q}</summary><p><b>Mark allocation:</b> 2 definition, 3 graph labels, 3 mechanism, 2 application/conclusion. <b>Full memo:</b> define the model, draw and label the graph, identify the private/predicted outcome, identify the efficient/social/policy outcome where relevant, explain the economic mechanism, then conclude with welfare, fairness, power or policy meaning. <b>Where marks are earned:</b> correct condition, correct labelled outcome, clear implication. <b>What students usually forget:</b> the comparison outcome and the final economic meaning.</p></details>`).join('')}</div>`;
}
function renderAudit(){
 const compact=graphs.filter(x=>x.included!=='Full card');
 document.getElementById('audit').innerHTML=sectionHead('Completion Audit')+`<div class="panel"><h3>Full graph inventory completion table</h3>${table(['Unit','Required count','Included count','Status'],Object.keys(unitNames).map(u=>[u,graphs.filter(g=>g.unit===u).length,graphs.filter(g=>g.unit===u).length,'Complete']))}<h3>Compact instead of full</h3>${compact.length?table(['Graph','Unit','Why compact'],compact.map(x=>[x.name,x.unit,'Marked light but keep or lower priority, but still included with diagram/rule/trap/practice'])):'<p>None.</p>'}<h3>Source gaps</h3><p>Unit 10 lecturer slides are missing locally; Unit 10 is built from textbook plus A2 past papers and feedback. Some macro/wrong-looking files were excluded unless directly relevant to A2 micro.</p><div class="box"><b>Confirmation:</b> Every Unit 4, 5, 6, 7, 8 and 10 graph/model from the controlling checklist is included. Top 10 is a priority drill only, not a reduced syllabus.</div></div>`;
}
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderAll(){
 document.getElementById('nav').innerHTML=sections.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('');
 renderDashboard();renderStrategy();renderInventory();[4,5,6,7,8,10].forEach(renderUnit);renderCalculations();renderRedraw();renderTrapBanks();renderLongTemplates();renderPastPapers();renderComparisons();renderDecoder();renderPanicPlansCram();renderBoss();renderAudit();updateProgress();applyFilters();
}
function updateProgress(){const done=graphs.filter(g=>storeGet('done-'+g.id)).length;document.querySelectorAll('#progressText').forEach(e=>e.textContent=Math.round(done/graphs.length*100)+'%');}
function applyFilters(){
 const q=document.getElementById('search').value.toLowerCase(), u=document.getElementById('unitFilter').value, l=document.getElementById('likelihoodFilter').value, ty=document.getElementById('typeFilter').value;
 document.querySelectorAll('.graph-card').forEach(c=>{let ok=true;if(q&&!c.dataset.search.includes(q))ok=false;if(u&&c.dataset.unit!==u)ok=false;if(l&&c.dataset.likelihood!==l)ok=false;if(ty&&!c.dataset.types.includes(ty))ok=false;c.classList.toggle('hidden',!ok);});
}
function jumpFilter(l){document.getElementById('likelihoodFilter').value=l;applyFilters();location.hash='inventory';}
['search','unitFilter','likelihoodFilter','typeFilter'].forEach(id=>{
 document.addEventListener('input',e=>{if(e.target&&e.target.id===id)applyFilters()});
 document.addEventListener('change',e=>{if(e.target&&e.target.id===id)applyFilters()});
});
document.addEventListener('click',e=>{
 const a=e.target.closest('aside .nav a');
 if(!a) return;
 const id=a.getAttribute('href').slice(1), target=document.getElementById(id);
 if(!target) return;
 e.preventDefault();
 target.scrollIntoView({behavior:'smooth',block:'start'});
 history.replaceState(null,'','#'+id);
 target.classList.remove('section-pulse');
 void target.offsetWidth;
 target.classList.add('section-pulse');
});
document.addEventListener('click',e=>{if(e.target.matches('[data-expand]'))document.querySelectorAll('details').forEach(d=>d.open=e.target.dataset.expand==='1')});
renderAll();
const topBtns=document.createElement('div');topBtns.className='btnrow no-print';topBtns.innerHTML='<button class="btn" data-expand="1">Expand all</button><button class="btn" data-expand="0">Collapse all</button>';document.querySelector('main').prepend(topBtns);
</script>
</body>
</html>
